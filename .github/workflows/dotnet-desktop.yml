name: Build BokuNoKanji

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Publish Windows app
        run: >
          dotnet publish BokuNoKanji/BokuNoKanji.csproj
          -c Release
          -f net9.0-windows10.0.19041.0
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:RuntimeIdentifierOverride=win10-x64
          --self-contained true
          -o ./publish/windows

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/windows/* `
            -DestinationPath ./BokuNoKanji-Windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BokuNoKanji-Windows-x64
          path: BokuNoKanji-Windows-x64.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select compatible Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          dotnet --info

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore BokuNoKanji/BokuNoKanji.csproj

      - name: Build Mac Catalyst
        run: >
          dotnet build BokuNoKanji/BokuNoKanji.csproj
          -f net9.0-maccatalyst
          -c Release
      
      - name: Publish Mac Catalyst app
        run: >
          dotnet publish BokuNoKanji/BokuNoKanji.csproj
          -f net9.0-maccatalyst
          -c Release
          -p:RuntimeIdentifier=maccatalyst-arm64
          -p:EnableCodeSigning=false

      - name: Upload Mac app
        uses: actions/upload-artifact@v4
        with:
          name: BokuNoKanji-macOS
          path: BokuNoKanji/bin/Release/net9.0-maccatalyst/maccatalyst-arm64/publish/*.app
          if-no-files-found: error





